# XcodeGen spec — run `xcodegen` in ios/ to (re)generate VortexNotes.xcodeproj.
# Set DEVELOPMENT_TEAM (your Apple team ID) and the bundle ids before signing for a device.
name: VortexNotes
options:
  bundleIdPrefix: dev.vortex303
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: K8YT3BZZAT
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  VortexKit:
    path: VortexKit
targets:
  VortexNotes-iOS:
    type: application
    platform: iOS
    sources: [App/Shared, App/iOS]
    dependencies:
      - package: VortexKit
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Vortex
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSAppTransportSecurity: {NSAllowsLocalNetworking: true}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vortex303.notes
        PRODUCT_NAME: Vortex
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  VortexNotes-macOS:
    type: application
    platform: macOS
    sources: [App/Shared, App/macOS]
    dependencies:
      - package: VortexKit
    entitlements:
      path: App/macOS/Vortex.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: Vortex
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        NSAppTransportSecurity: {NSAllowsLocalNetworking: true}
    settings:
      base:
        # Same id as iPhone = one App Store listing (Universal Purchase).
        PRODUCT_BUNDLE_IDENTIFIER: dev.vortex303.notes
        PRODUCT_NAME: Vortex
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
  VortexNotes-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [App/UITests]
    dependencies:
      - target: VortexNotes-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vortex303.notes.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VortexNotes-iOS
schemes:
  VortexNotes-iOS:
    build:
      targets:
        VortexNotes-iOS: all
        VortexNotes-iOSUITests: [test]
    test:
      targets: [VortexNotes-iOSUITests]
  VortexNotes-macOS:
    build:
      targets:
        VortexNotes-macOS: all
